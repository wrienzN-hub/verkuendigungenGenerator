[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verkuendigungen-generator"
version = "0.1.0"
description = "Directorium-Import und Datenbank für Verkündigungen der Diözese Gurk"
requires-python = ">=3.12"
dependencies = ["pypdf==6.10.0", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
verkuendigungen = "verkuendigungen.cli:main"

[tool.setuptools.package-data]
verkuendigungen = ["infrastructure/migrations/*.sql"]

[tool.setuptools.packages.find]
include = ["verkuendigungen*"]
